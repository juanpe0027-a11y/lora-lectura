<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#070f1c">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Mis baterías</title>
<style>
  :root { color-scheme:dark; --fondo:#070f1c; --panel:#121e2e; --panel2:#1b2a3c; --panel3:#24364b; --linea:#2c3e53; --texto:#eaf0f6; --suave:#a3b3c5; --verde:#3ddc84; --verde-f:rgba(61,220,132,.14); --naranja:#ffa62b; --naranja-f:rgba(255,166,43,.15); --rojo:#ff6468; --rojo-f:rgba(255,100,104,.16); --turquesa:#2fd6d6; --turquesa-f:rgba(47,214,214,.13); --serie:#3d97e6; --rejilla:rgba(255,255,255,.09); --sobre:#07131f; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { color-scheme:light; --fondo:#e9eef4; --panel:#ffffff; --panel2:#f0f4f8; --panel3:#e2e9f0; --linea:#ccd6e1; --texto:#0f1c2c; --suave:#4c5d73; --verde:#0a7a44; --verde-f:rgba(10,122,68,.11); --naranja:#a85600; --naranja-f:rgba(168,86,0,.11); --rojo:#c4262e; --rojo-f:rgba(196,38,46,.1); --turquesa:#07767d; --turquesa-f:rgba(7,118,125,.1); --serie:#1a6fc2; --rejilla:rgba(15,28,44,.1); --sobre:#ffffff; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  body { margin:0; min-height:100vh; background:var(--fondo); color:var(--texto); font:15.5px/1.45 "Segoe UI Variable Text","Segoe UI",Roboto,system-ui,-apple-system,sans-serif; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; background:url(assets/nave.jpg) center 35%/cover no-repeat; opacity:.08; pointer-events:none; }
  h1 { margin:0; font-size:23px; font-weight:700; letter-spacing:-.012em; }
  h2 { margin:0 0 12px; font-size:12.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--suave); }
  button, input { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--turquesa); outline-offset:2px; }
  .c-verde { color:var(--verde); } .c-naranja { color:var(--naranja); } .c-rojo { color:var(--rojo); } .c-suave { color:var(--suave); }
  .cab { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:calc(8px + env(safe-area-inset-top)) 16px 8px; background:var(--panel); border-bottom:1px solid var(--linea); }
  .logo { display:block; padding:5px 9px; border-radius:7px; background:#fff; line-height:0; }
  .logo img { height:26px; width:auto; }
  .contenido { max-width:1100px; margin:0 auto; padding:16px 16px calc(24px + env(safe-area-inset-bottom)); }
  .panel { min-width:0; padding:16px; border:1px solid var(--linea); border-radius:10px; background:var(--panel); }
  .pila { display:grid; gap:12px; }
  .pagina { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .pagina p { margin:2px 0 0; color:var(--suave); font-size:14px; }
  .boton { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:42px; padding:8px 14px; border:1px solid var(--linea); border-radius:7px; background:var(--panel2); color:var(--texto); font-weight:600; font-size:14px; cursor:pointer; }
  .boton:hover { background:var(--panel3); }
  .boton.principal { width:100%; border-color:var(--turquesa); color:var(--turquesa); background:var(--turquesa-f); font-size:15.5px; min-height:48px; }
  .pastilla { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:5px; font-size:11.5px; font-weight:700; letter-spacing:.04em; white-space:nowrap; }
  .pastilla::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .si { color:var(--verde); background:var(--verde-f); } .ojo { color:var(--naranja); background:var(--naranja-f); } .no { color:var(--rojo); background:var(--rojo-f); } .gris { color:var(--suave); background:var(--panel2); }

  /* Entrada */
  .entrada { display:grid; place-items:center; min-height:100vh; padding:16px; }
  .entrada .panel { width:100%; max-width:380px; padding:24px 20px; }
  .entrada .logo { display:inline-block; margin-bottom:18px; }
  .entrada h1 { margin-bottom:4px; }
  .entrada p { margin:0 0 18px; color:var(--suave); font-size:14px; }
  label { display:block; margin:12px 0 6px; font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--suave); }
  input { width:100%; min-height:46px; padding:8px 12px; border:1px solid var(--linea); border-radius:7px; background:var(--panel2); font-size:16px; }
  .error { min-height:22px; margin:10px 0 6px; color:var(--rojo); font-size:14px; font-weight:600; }

  /* Resumen */
  .kpis { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:12px; }
  .kpi { padding:14px; border:1px solid var(--linea); border-left:3px solid var(--linea); border-radius:8px; background:var(--panel); }
  .kpi small { display:block; color:var(--suave); font-size:12.5px; font-weight:600; }
  .kpi b { display:block; margin-top:2px; font-size:26px; font-variant-numeric:tabular-nums; }
  .kpi.t-verde { border-left-color:var(--verde); } .kpi.t-rojo { border-left-color:var(--rojo); } .kpi.t-turq { border-left-color:var(--turquesa); } .kpi.t-naranja { border-left-color:var(--naranja); }
  .avisos { display:grid; gap:8px; margin-bottom:12px; }
  .aviso { display:flex; align-items:flex-start; gap:10px; width:100%; padding:11px 13px; border:1px solid; border-radius:8px; text-align:left; cursor:pointer; }
  .aviso.n2 { border-color:color-mix(in srgb, var(--rojo) 55%, transparent); background:var(--rojo-f); }
  .aviso.n1 { border-color:color-mix(in srgb, var(--naranja) 55%, transparent); background:var(--naranja-f); }
  .aviso b { display:block; }
  .aviso span { color:var(--suave); font-size:13.5px; }
  .aviso i { flex:none; display:grid; place-items:center; width:22px; height:22px; border-radius:50%; font-style:normal; font-weight:800; font-size:13px; color:var(--sobre); }
  .aviso.n2 i { background:var(--rojo); } .aviso.n1 i { background:var(--naranja); }
  .tarjetas { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
  .tarjeta { display:block; width:100%; padding:14px; border:1px solid var(--linea); border-radius:10px; background:var(--panel); text-align:left; cursor:pointer; }
  .tarjeta:hover { background:var(--panel2); }
  .tarjeta.mal { border-color:color-mix(in srgb, var(--rojo) 60%, transparent); }
  .tarjeta.ojo-b { border-color:color-mix(in srgb, var(--naranja) 60%, transparent); }
  .t-arriba { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .t-arriba strong { font-size:16px; }
  .porcentaje { margin:10px 0 6px; font-size:34px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
  .porcentaje small { font-size:18px; color:var(--suave); }
  .barra { height:8px; border-radius:4px; background:var(--panel3); overflow:hidden; }
  .barra i { display:block; height:100%; border-radius:4px; background:var(--verde); transition:width .6s; }
  .barra.media i { background:var(--naranja); } .barra.baja i { background:var(--rojo); }
  .t-abajo { display:flex; justify-content:space-between; gap:8px; margin-top:9px; color:var(--suave); font-size:13.5px; }
  .t-abajo b { color:var(--texto); }
  .t-motivo { margin-top:8px; font-size:13.5px; font-weight:600; }

  /* Ficha */
  .volver { display:flex; align-items:center; gap:10px; }
  .grande { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .dato { padding:14px; border:1px solid var(--linea); border-radius:8px; background:var(--panel2); }
  .dato small { display:block; color:var(--suave); font-size:12.5px; font-weight:600; }
  .dato b { font-size:24px; font-variant-numeric:tabular-nums; }
  .dato span { display:block; color:var(--suave); font-size:12.5px; }
  .grafica { position:relative; }
  .grafica svg { display:block; width:100%; height:200px; overflow:visible; touch-action:pan-y; }
  .tip { position:absolute; top:0; padding:6px 9px; border:1px solid var(--linea); border-radius:6px; background:var(--panel); font-size:13px; white-space:nowrap; pointer-events:none; transform:translateX(-50%); }
  .tabla { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:9px 8px; border-bottom:1px solid var(--linea); text-align:left; white-space:nowrap; }
  th { color:var(--suave); font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
  tr.roja td { background:var(--rojo-f); }
  .pista { margin:10px 0 0; color:var(--suave); font-size:13px; }
  @media (min-width:760px) {
    .kpis { grid-template-columns:repeat(4,minmax(0,1fr)); }
    .grande { grid-template-columns:repeat(4,minmax(0,1fr)); }
    .dos { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  }
</style>
</head>
<body>

<div class="entrada" id="v-entrada">
  <div class="panel">
    <span class="logo"><img src="assets/logo.png" alt="Endurance"></span>
    <h1>Mis baterías</h1>
    <p>Entra con el usuario de tu polígono.</p>
    <form id="f-entrar" novalidate>
      <label for="usuario">Usuario</label>
      <input id="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Por ejemplo: Polígono Zaragoza" required>
      <label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password" required>
      <p class="error" id="error" role="alert"></p>
      <button class="boton principal" type="submit">Entrar</button>
    </form>
  </div>
</div>

<div id="v-app" hidden>
  <header class="cab">
    <span class="logo"><img src="assets/logo.png" alt="Endurance"></span>
    <button class="boton" type="button" id="salir">Salir</button>
  </header>
  <div class="contenido">
    <main id="v-resumen">
      <div class="pagina"><div><h1 id="r-titulo"></h1><p id="r-sub"></p></div></div>
      <div class="kpis" id="r-kpis"></div>
      <div class="avisos" id="r-avisos"></div>
      <section class="panel"><h2>Baterías</h2><div class="tarjetas" id="r-tarjetas"></div></section>
    </main>
    <main id="v-ficha" hidden>
      <div class="pagina"><div class="volver"><button class="boton" type="button" id="volver" aria-label="Volver">‹ Volver</button><h1 id="f-titulo"></h1><span id="f-estado"></span></div></div>
      <div class="pila">
        <div class="avisos" id="f-avisos" style="margin:0"></div>
        <section class="panel"><div class="grande" id="f-datos"></div></section>
        <section class="panel"><h2>Carga en las últimas 24 horas</h2><div class="grafica" id="f-grafica"><svg role="img" aria-label="Porcentaje de carga en las últimas 24 horas"></svg><div class="tip" hidden></div></div></section>
        <section class="panel"><h2>Registro de carga</h2><div class="tabla" id="f-cargas"></div><p class="pista">En rojo: la han desenchufado antes de terminar de cargar varias veces seguidas. Cargarla siempre hasta el 100 % alarga su vida.</p></section>
      </div>
    </main>
  </div>
</div>

<script>
  // Página para el cliente: solo carga, ciclos y avisos sencillos. Datos de demostración.
  // Ojo: la contraseña se comprueba en el navegador; vale para enseñar, no como protección de verdad.
  const $ = id => document.getElementById(id);
  const escapar = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
  const plano = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const azar = (a, b) => a + Math.random() * (b - a);
  const memoria = { leer(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, guardar(k, v) { try { if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } } };

  // Usuarios: el nombre del polígono (da igual mayúsculas, acentos o si se escribe «Polígono»). Se guarda el resumen SHA-256 de la contraseña.
  const CLAVE_1234 = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
  const POLIGONOS = {
    zaragoza: { id: 'F', nombre: 'Plataforma logística Zaragoza', tipo: 'carretilla elevadora', tipos: 'carretillas elevadoras', n: 2, clave: CLAVE_1234 },
    paterna: { id: 'C', nombre: 'Polígono Paterna', tipo: 'batería estacionaria', tipos: 'baterías estacionarias', n: 15, clave: CLAVE_1234 },
    ribaroja: { id: 'D', nombre: 'Polígono Riba-roja', tipo: 'batería estacionaria', tipos: 'baterías estacionarias', n: 23, clave: CLAVE_1234 },
  };
  const MALAS_CARGAS = ['F-01', 'C-07', 'D-12'], REVISAR = { 'C-04': 1, 'D-17': 1, 'D-09': 1 };
  const LLENA = 99, CORTES_ROJO = 3, BAJA = 20;

  async function resumenClave(t) {
    const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  const buscarPoligono = u => { const q = plano(u).replace(/^poligono/, '').replace(/^plataformalogistica/, ''); return POLIGONOS[q] ? q : null; };

  // --- Datos de demostración ---
  function cargasDemo(id) {
    const l = [], ahora = Date.now(), mala = MALAS_CARGAS.includes(id);
    let t = ahora - 7 * 864e5 + azar(0, 6) * 36e5;
    while (t < ahora - 3 * 36e5) {
      const ultimas = mala && ahora - t < 864e5, corta = ultimas || Math.random() < 0.1;
      const socIni = Math.round(azar(15, 50)), socFin = corta ? Math.min(92, socIni + Math.round(azar(6, 30))) : 100;
      const dur = corta ? azar(10, 50) * 6e4 : (100 - socIni) * azar(2.4, 3.2) * 6e4;
      l.unshift({ ini: t, fin: t + dur, socIni, socFin });
      t += dur + (ultimas ? azar(0.6, 2.5) : azar(9, 22)) * 36e5;
      if (mala && !ultimas && t > ahora - 864e5) t = Math.min(t, ahora - 20 * 36e5);
    }
    return l;
  }
  function crearBaterias(p) {
    return Array.from({ length: p.n }, (_, i) => {
      const id = p.id + '-' + String(i + 1).padStart(2, '0'), cargas = cargasDemo(id), u = cargas[0];
      // Desde la última carga ha ido bajando poco a poco
      const soc = Math.max(8, Math.min(98, u.socFin - (Date.now() - u.fin) / 36e5 * azar(1, 6)));
      return { id, cargas, soc, ciclos: azar(150, 950), salud: azar(86, 99), estado: 'uso', hasta: Date.now() + azar(30, 120) * 1000 };
    });
  }
  function apuntarCarga(log, enchufado, t, soc) {
    const u = log[0], abierta = u && u.fin === null;
    if (enchufado && !abierta) log.unshift({ ini: t, fin: null, socIni: soc, socFin: null });
    if (!enchufado && abierta) { u.fin = t; u.socFin = soc; }
  }
  // Cada 2 s: en uso baja, cargando sube; de vez en cuando cambia. Las «malas» se desenchufan antes de tiempo.
  function avanzar(b) {
    const ahora = Date.now();
    if (b.estado === 'carga') { b.soc = Math.min(100, b.soc + 0.25); b.ciclos += 0.0025; }
    else if (b.estado === 'uso') b.soc = Math.max(5, b.soc - azar(0.03, 0.12));
    if (ahora > b.hasta || (b.estado === 'carga' && b.soc >= 100)) {
      const antes = b.estado;
      b.estado = antes === 'carga' ? (Math.random() < 0.5 ? 'uso' : 'reposo') : b.soc < 45 || Math.random() < 0.3 ? 'carga' : antes === 'uso' ? 'reposo' : 'uso';
      b.hasta = ahora + (b.estado === 'carga' ? (MALAS_CARGAS.includes(b.id) ? azar(20, 60) : azar(200, 400)) : azar(40, 150)) * 1000;
      apuntarCarga(b.cargas, b.estado === 'carga', ahora, Math.round(b.soc));
    }
  }

  // --- Lo que ve el cliente ---
  const cortesSeguidos = log => { let n = 0; for (const c of log) { if (c.fin === null) continue; if (c.socFin >= LLENA) break; n++; } return n; };
  function avisosDe(b) {
    const a = [], cortes = cortesSeguidos(b.cargas);
    if (REVISAR[b.id]) a.push({ nivel: 2, titulo: 'Necesita revisión', texto: 'Hemos detectado un problema en esta batería. Nuestro servicio técnico se pondrá en contacto contigo.' });
    if (cortes >= CORTES_ROJO) a.push({ nivel: 2, titulo: 'Se desenchufa antes de cargar del todo', texto: 'La han desenchufado ' + cortes + ' veces seguidas sin llegar al 100 %. Déjala cargar hasta el final.' });
    if (b.soc < BAJA && b.estado !== 'carga') a.push({ nivel: 1, titulo: 'Carga baja', texto: 'Le queda un ' + Math.round(b.soc) + ' %. Conviene ponerla a cargar.' });
    return a;
  }
  const ESTADOS = { carga: ['si', 'CARGANDO'], uso: ['gris', 'EN USO'], reposo: ['gris', 'EN REPOSO'] };
  const pastillaEstado = b => { const a = avisosDe(b), n = Math.max(0, ...a.map(x => x.nivel)); return n === 2 ? '<span class="pastilla no">REVISAR</span>' : n === 1 ? '<span class="pastilla ojo">AVISO</span>' : '<span class="pastilla ' + ESTADOS[b.estado][0] + '">' + ESTADOS[b.estado][1] + '</span>'; };
  const claseBarra = s => s < BAJA ? 'baja' : s < 50 ? 'media' : '';
  const hora = t => new Date(t).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  const fechaCorta = t => new Date(t).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  function duracion(ms) { const m = Math.max(1, Math.round(ms / 6e4)); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min'; }
  const kpi = (t, v, s, tono) => '<div class="kpi ' + tono + '"><small>' + t + '</small><b>' + v + '</b><small>' + s + '</small></div>';
  const avisoHtml = (a, b) => '<button class="aviso n' + a.nivel + '" type="button"' + (b ? ' data-bat="' + b.id + '"' : '') + '><i>!</i><span><b>' + (b ? escapar(b.id) + ' · ' : '') + escapar(a.titulo) + '</b>' + escapar(a.texto) + '</span></button>';

  let pol = null, baterias = [], abierta = null;
  function pintarResumen() {
    $('r-titulo').textContent = pol.nombre;
    $('r-sub').textContent = baterias.length + ' · ' + (baterias.length === 1 ? pol.tipo : pol.tipos);
    const media = baterias.reduce((a, b) => a + b.soc, 0) / baterias.length, cargando = baterias.filter(b => b.estado === 'carga').length;
    const todos = []; baterias.forEach(b => avisosDe(b).forEach(a => todos.push({ a, b })));
    todos.sort((x, y) => y.a.nivel - x.a.nivel);
    $('r-kpis').innerHTML = kpi('Carga media', Math.round(media) + ' %', 'De todas las baterías', media < 30 ? 't-naranja' : 't-verde') + kpi('Cargando ahora', cargando, 'Enchufadas al cargador', 't-turq') + kpi('Ciclos de media', Math.round(baterias.reduce((a, b) => a + b.ciclos, 0) / baterias.length), 'Cargas completas equivalentes', '') + kpi('Avisos', todos.length, todos.length ? 'Pulsa un aviso para ver la batería' : 'Todo correcto', todos.length ? 't-rojo' : 't-verde');
    $('r-avisos').innerHTML = todos.map(x => avisoHtml(x.a, x.b)).join('');
    const orden = baterias.slice().sort((x, y) => Math.max(0, ...avisosDe(y).map(a => a.nivel)) - Math.max(0, ...avisosDe(x).map(a => a.nivel)) || x.id.localeCompare(y.id));
    $('r-tarjetas').innerHTML = orden.map(b => {
      const a = avisosDe(b), n = Math.max(0, ...a.map(x => x.nivel)), s = Math.round(b.soc);
      return '<button class="tarjeta' + (n === 2 ? ' mal' : n === 1 ? ' ojo-b' : '') + '" type="button" data-bat="' + b.id + '"><div class="t-arriba"><strong>' + escapar(b.id) + '</strong>' + pastillaEstado(b) + '</div><div class="porcentaje">' + s + '<small> %</small></div><div class="barra ' + claseBarra(s) + '"><i style="width:' + s + '%"></i></div><div class="t-abajo"><span>Ciclos <b>' + Math.floor(b.ciclos) + '</b></span><span>' + (b.estado === 'carga' ? 'Cargando' : 'Última carga ' + fechaCorta((b.cargas[0] || {}).ini || Date.now())) + '</span></div>' + (a.length ? '<div class="t-motivo ' + (n === 2 ? 'c-rojo' : 'c-naranja') + '">' + escapar(a[0].titulo) + '</div>' : '') + '</button>';
    }).join('');
  }
  // Porcentaje cada 10 min a partir del registro de carga: sube mientras carga y baja poco a poco entre cargas
  function serieSoc(b) {
    const ahora = Date.now(), pts = [], l = b.cargas.slice().reverse();
    for (let t = ahora - 864e5; t <= ahora; t += 6e5) {
      let v = null;
      const en = l.find(c => c.ini <= t && (c.fin === null || c.fin >= t));
      if (en) v = en.fin === null ? en.socIni + (b.soc - en.socIni) * (t - en.ini) / Math.max(1, ahora - en.ini) : en.socIni + (en.socFin - en.socIni) * (t - en.ini) / (en.fin - en.ini);
      else {
        const antes = l.filter(c => c.fin !== null && c.fin < t).pop(), despues = l.find(c => c.ini > t);
        const a = antes ? [antes.fin, antes.socFin] : [ahora - 864e5, 60], z = despues ? [despues.ini, despues.socIni] : [ahora, b.soc];
        v = a[1] + (z[1] - a[1]) * (t - a[0]) / Math.max(1, z[0] - a[0]);
      }
      pts.push([t, Math.max(0, Math.min(100, v))]);
    }
    pts.push([ahora, b.soc]);
    return pts;
  }
  function pintarGrafica(b) {
    const caja = $('f-grafica'), svg = caja.querySelector('svg'), w = svg.clientWidth || 600, h = 200, iz = 34, ab = 22, pts = serieSoc(b);
    const x = t => iz + (t - pts[0][0]) / (pts[pts.length - 1][0] - pts[0][0]) * (w - iz - 6), y = v => 6 + (100 - v) / 100 * (h - 6 - ab);
    let s = '';
    [0, 50, 100].forEach(v => { s += '<line x1="' + iz + '" x2="' + w + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--rejilla)"/><text x="' + (iz - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--suave)">' + v + ' %</text>'; });
    [0, 6, 12, 18, 24].forEach(k => { const t = pts[0][0] + k * 36e5; s += '<text x="' + x(t) + '" y="' + (h - 4) + '" text-anchor="' + (k === 0 ? 'start' : k === 24 ? 'end' : 'middle') + '" font-size="11" fill="var(--suave)">' + (k === 24 ? 'Ahora' : hora(t)) + '</text>'; });
    const linea = pts.map(p => x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1)).join(' ');
    s += '<polygon points="' + x(pts[0][0]) + ',' + y(0) + ' ' + linea + ' ' + x(pts[pts.length - 1][0]) + ',' + y(0) + '" fill="var(--serie)" opacity=".12"/><polyline points="' + linea + '" fill="none" stroke="var(--serie)" stroke-width="2" stroke-linejoin="round"/>';
    s += '<line id="g-cruz" y1="6" y2="' + (h - ab) + '" stroke="var(--suave)" stroke-dasharray="3 3" hidden/><circle id="g-punto" r="4.5" fill="var(--serie)" stroke="var(--panel)" stroke-width="2" hidden/>';
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.innerHTML = s;
    svg.onpointermove = ev => {
      const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * w;
      let p = pts[0]; pts.forEach(q => { if (Math.abs(x(q[0]) - px) < Math.abs(x(p[0]) - px)) p = q; });
      const cx = x(p[0]), cy = y(p[1]), tip = caja.querySelector('.tip');
      const cruz = svg.querySelector('#g-cruz'), punto = svg.querySelector('#g-punto');
      cruz.removeAttribute('hidden'); punto.removeAttribute('hidden');
      cruz.setAttribute('x1', cx); cruz.setAttribute('x2', cx); punto.setAttribute('cx', cx); punto.setAttribute('cy', cy);
      tip.hidden = false; tip.innerHTML = '<b>' + Math.round(p[1]) + ' %</b> · ' + hora(p[0]);
      tip.style.left = Math.max(50, Math.min(r.width - 50, cx / w * r.width)) + 'px'; tip.style.top = Math.max(0, cy / h * r.height - 40) + 'px';
    };
    svg.onpointerleave = () => { caja.querySelector('.tip').hidden = true; svg.querySelector('#g-cruz').setAttribute('hidden', ''); svg.querySelector('#g-punto').setAttribute('hidden', ''); };
  }
  function pintarFicha() {
    const b = baterias.find(x => x.id === abierta);
    if (!b) return;
    const a = avisosDe(b), s = Math.round(b.soc), cortes = cortesSeguidos(b.cargas), rojo = cortes >= CORTES_ROJO;
    $('f-titulo').textContent = b.id;
    $('f-estado').innerHTML = pastillaEstado(b);
    $('f-avisos').innerHTML = a.map(x => avisoHtml(x, null)).join('');
    const dia = Date.now() - 864e5, hoy = b.cargas.filter(c => c.ini >= dia);
    $('f-datos').innerHTML =
      '<div class="dato"><small>Carga</small><b class="' + (s < BAJA ? 'c-rojo' : '') + '">' + s + ' %</b><div class="barra ' + claseBarra(s) + '" style="margin-top:8px"><i style="width:' + s + '%"></i></div></div>' +
      '<div class="dato"><small>Ciclos de carga</small><b>' + Math.floor(b.ciclos) + '</b><span>Cargas completas equivalentes</span></div>' +
      '<div class="dato"><small>Salud de la batería</small><b>' + Math.round(b.salud) + ' %</b><span>Capacidad que le queda</span></div>' +
      '<div class="dato"><small>Cargas hoy</small><b class="' + (rojo ? 'c-rojo' : '') + '">' + hoy.length + '</b><span>' + (cortes ? cortes + ' seguidas sin llegar al 100 %' : 'Todas completas') + '</span></div>';
    let racha = rojo ? cortes : 0;
    $('f-cargas').innerHTML = '<table><thead><tr><th>Enchufada</th><th>Desenchufada</th><th>Tiempo</th><th>Carga</th><th></th></tr></thead><tbody>' + b.cargas.slice(0, 60).map(c => {
      const roja = c.fin !== null && racha-- > 0, llena = c.fin !== null && c.socFin >= LLENA;
      return '<tr' + (roja ? ' class="roja"' : '') + '><td>' + fechaCorta(c.ini) + '</td><td>' + (c.fin === null ? '<span class="c-verde">Cargando</span>' : fechaCorta(c.fin)) + '</td><td>' + duracion((c.fin || Date.now()) - c.ini) + '</td><td>' + c.socIni + ' % → ' + (c.fin === null ? s : c.socFin) + ' %</td><td>' + (c.fin === null ? '' : llena ? '<span class="c-verde">Completa</span>' : '<b class="' + (roja ? 'c-rojo' : 'c-naranja') + '">Sin terminar</b>') + '</td></tr>';
    }).join('') + '</tbody></table>';
    // La gráfica se redibuja cada minuto (o al girar el móvil) para no quitar la burbuja mientras se mira
    if (Date.now() - graficaHora > 6e4 || graficaDe !== b.id) { graficaHora = Date.now(); graficaDe = b.id; pintarGrafica(b); }
  }
  let graficaHora = 0, graficaDe = null;
  function pintar() { if (!pol) return; if (abierta) pintarFicha(); else pintarResumen(); }
  function abrir(id) { abierta = id; $('v-resumen').hidden = !!id; $('v-ficha').hidden = !id; pintar(); window.scrollTo(0, 0); }

  function entrar(clave) {
    pol = POLIGONOS[clave];
    baterias = crearBaterias(pol);
    $('v-entrada').hidden = true; $('v-app').hidden = false;
    abrir(null);
  }
  $('f-entrar').addEventListener('submit', async ev => {
    ev.preventDefault();
    const k = buscarPoligono($('usuario').value), r = await resumenClave($('clave').value);
    if (!k || POLIGONOS[k].clave !== r) { $('error').textContent = 'Usuario o contraseña incorrectos.'; $('clave').value = ''; return; }
    $('error').textContent = ''; $('clave').value = '';
    memoria.guardar('cliente', k);
    entrar(k);
  });
  $('salir').onclick = () => { memoria.guardar('cliente', null); pol = null; abierta = null; $('v-app').hidden = true; $('v-entrada').hidden = false; $('usuario').value = ''; };
  $('volver').onclick = () => abrir(null);
  document.addEventListener('click', ev => { const el = ev.target.closest('[data-bat]'); if (el && pol && !abierta) abrir(el.dataset.bat); });
  window.addEventListener('resize', () => { graficaHora = 0; if (abierta) pintar(); });
  setInterval(() => { if (!pol) return; baterias.forEach(avanzar); pintar(); }, 2000);
  const guardada = memoria.leer('cliente');
  if (guardada && POLIGONOS[guardada]) entrar(guardada);
</script>
